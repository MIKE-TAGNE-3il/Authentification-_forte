# ═══════════════════════════════════════════════════════════════════════════════
#  AuthForte — docker-compose.windows.yml  (OVERRIDE WINDOWS)
#
#  Spécificités Windows :
#   - Partage USB via usbipd-win (NFC, Cryptonox, Yubikey)
#   - Le démon pcscd tourne DANS le conteneur backend (mode privileged)
#   - Pas de montage de socket Unix pcscd (non disponible sous Windows)
#
#  Usage :
#    docker compose -f docker-compose.yml -f docker-compose.windows.yml up -d
#    OU : make start-windows
# ═══════════════════════════════════════════════════════════════════════════════

services:

  backend:
    # Nécessaire pour accéder aux périphériques USB depuis le conteneur
    privileged: true
    environment:
      # Forcer pcscd à démarrer en mode standalone dans le conteneur
      PCSCD_ARGS: "--foreground"
    # Surcharge du CMD pour démarrer pcscd puis Flask
    command: >
      sh -c "service pcscd start || pcscd --foreground &
             sleep 2 &&
             python Backend/app.py"
