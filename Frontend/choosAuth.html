<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Sécurité - Authentification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="choose-auth-page">

<div class="auth-page">
    <div class="auth-header">
        <h2>Sécurisez votre compte</h2>
        <p>Choisissez votre méthode de double authentification (2FA).</p>
    </div>

    <form action="/select-auth-method" method="POST">
        <div class="auth-options">
            <label class="auth-card">
                <input type="radio" name="auth_method" value="microsoft" required>
                <div class="icon-box"><i data-lucide="smartphone"></i></div>
                <div class="auth-content">
                    <span class="auth-title">Microsoft Authenticator</span>
                    <span class="auth-desc">Approbation par notification push ou code OTP.</span>
                </div>
                <i data-lucide="check-circle-2" class="check-badge"></i>
            </label>

            <label class="auth-card">
                <input type="radio" name="auth_method" value="google">
                <div class="icon-box"><i data-lucide="shield-check"></i></div>
                <div class="auth-content">
                    <span class="auth-title">Google Authenticator</span>
                    <span class="auth-desc">Codes temporaires générés localement.</span>
                </div>
                <i data-lucide="check-circle-2" class="check-badge"></i>
            </label>

            <label class="auth-card">
                <input type="radio" name="auth_method" value="yubikey">
                <div class="icon-box"><i data-lucide="key-round"></i></div>
                <div class="auth-content">
                    <span class="auth-title">Clé de sécurité</span>
                    <span class="auth-desc">Protection matérielle physique (YubiKey).</span>
                </div>
                <i data-lucide="check-circle-2" class="check-badge"></i>
            </label>

            <label class="auth-card">
                <input type="radio" name="auth_method" value="cryptonox">
                <div class="icon-box"><i data-lucide="credit-card"></i></div>
                <div class="auth-content">
                    <span class="auth-title">Carte Cryptonox</span>
                    <span class="auth-desc">Authentification par carte à puce FIDO2.</span>
                </div>
                <i data-lucide="check-circle-2" class="check-badge"></i>
            </label>

            <label class="auth-card">
                <input type="radio" name="auth_method" value="authy">
                <div class="icon-box"><i data-lucide="refresh-cw"></i></div>
                <div class="auth-content">
                    <span class="auth-title">Authy</span>
                    <span class="auth-desc">Synchronisation multi-appareils sécurisée.</span>
                </div>
                <i data-lucide="check-circle-2" class="check-badge"></i>
            </label>

            <label class="auth-card">
                <input type="radio" name="auth_method" value="freeotp">
                <div class="icon-box"><i data-lucide="unlock"></i></div>
                <div class="auth-content">
                    <span class="auth-title">FreeOTP</span>
                    <span class="auth-desc">Solution open source respectueuse de la vie privée.</span>
                </div>
                <i data-lucide="check-circle-2" class="check-badge"></i>
            </label>

            <label class="auth-card">
                <input type="radio" name="auth_method" value="nfc">
                <div class="icon-box"><i data-lucide="wifi"></i></div>
                <div class="auth-content">
                    <span class="auth-title">Carte NFC</span>
                    <span class="auth-desc">Authentification sans contact par badge NFC.</span>
                </div>
                <i data-lucide="check-circle-2" class="check-badge"></i>
            </label>

            <label class="auth-card">
                <input type="radio" name="auth_method" value="email">
                <div class="icon-box"><i data-lucide="mail"></i></div>
                <div class="auth-content">
                    <span class="auth-title">Code par e-mail</span>
                    <span class="auth-desc">Réception du code sur votre boîte principale.</span>
                </div>
                <i data-lucide="check-circle-2" class="check-badge"></i>
            </label>
        </div>

        <div class="submit-container">
            <button type="submit" class="btn-submit">Confirmer la méthode</button>
        </div>
    </form>
</div>

<script>
    lucide.createIcons();
</script>

</body>
</html>
