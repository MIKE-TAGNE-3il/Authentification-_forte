# ═══════════════════════════════════════════════════════════════════════════════
#  AuthForte — docker-compose.yml  (BASE — COMMUN Windows + Linux)
#
#  Usage :
#    Windows  → docker compose -f docker-compose.yml -f docker-compose.windows.yml up -d
#    Linux    → docker compose -f docker-compose.yml -f docker-compose.linux.yml   up -d
#    Makefile → make start-windows  /  make start-linux
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── Base de données MySQL 8.0 ───────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: authforte-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_password}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-authentification}
      MYSQL_USER:          ${MYSQL_USER:-authforte}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD:-authforte_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "--password=${MYSQL_ROOT_PASSWORD:-root_secure_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - authforte-net

  # ── Backend Flask ───────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: authforte-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Hot-reload en développement : montage du code source
      - ./Backend:/app/Backend:ro
      - ./Frontend:/app/Frontend:ro
      - ./static:/app/static:ro
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - authforte-net

  # ── Reverse proxy Nginx ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: authforte-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - authforte-net

  # ── MailHog (SMTP de développement) ────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: authforte-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Interface web MailHog
    networks:
      - authforte-net

# ── Volumes persistants ─────────────────────────────────────────────────────
volumes:
  db_data:
    name: authforte-db-data

# ── Réseau interne ──────────────────────────────────────────────────────────
networks:
  authforte-net:
    name: authforte-network
    driver: bridge
