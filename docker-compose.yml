# ═══════════════════════════════════════════════════════════════════════════════
#  AuthForte — docker-compose.yml (Version Optimisée Matériel)
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── Base de données MySQL 8.0 ───────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: authforte-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: authentification
      MYSQL_USER: authforte
      MYSQL_PASSWORD: authforte_password
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=root_secure_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - authforte-net

  # ── Backend Flask ───────────────────────────────────────────────────────────
  backend:
    build: .
    container_name: authforte-backend
    restart: unless-stopped
    privileged: true          
    user: root                
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /dev/bus/usb:/dev/bus/usb 
    ports:
      - "5000:5000"
    networks:
      - authforte-net
    security_opt:
      - seccomp:unconfined

  # ── Reverse proxy Nginx ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: authforte-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - backend
    networks:
      - authforte-net

  # ── MailHog ────────────────────────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: authforte-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"   
    networks:
      - authforte-net

# ── Volumes persistants ─────────────────────────────────────────────────────
volumes:
  db_data:
    name: authforte-db-data

# ── Réseau interne ──────────────────────────────────────────────────────────
networks:
  authforte-net:
    name: authforte-network
    driver: bridge